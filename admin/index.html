<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo | Coletivo Cultural Insana RJ</title>
  
  <!-- Netlify Identity Widget (Obrigatório para gerenciar o login) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    /* Estilização básica para a tela de carregamento antes do painel abrir */
    body {
      margin: 0;
      padding: 0;
      background-color: #0F0716; /* Cor de fundo Roxo Escuro da identidade visual */
      color: #39FF14; /* Verde Neon */
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <!-- Carregamento do painel principal do Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Script para garantir o redirecionamento após o login via Identity -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
